<!doctype html>
<!-- PROTOTYPE, throwaway: bill review variants, switch with ?variant=A|B|C|D|R -->
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<title>Bill review prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--surface-2:#FBFAF7;--line:#E4E0D6;--line-strong:#8E897D;
  --ink:#1C1B19;--ink-2:#55524B;--ink-3:#6F6B62;--accent:#2B3A8C;--accent-bg:#E9ECF9;
  --warn:#7A4F00;--warn-bg:#FBF1D9;--bad:#A8321F;--bad-bg:#FBE9E5;--on-accent:#FFFFFF;
  --box-accent:#2B3A8C;--box-warn:#B26A00;--box-warn-ink:#8F5500;--box-ink:#1C1B19;--box-bad:#A8321F;--scrim:rgba(20,20,19,.35);
  --serif:"Source Serif 4",ui-serif,Georgia,serif;--sans:Inter,ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--surface:#1C1C1A;--surface-2:#232320;--line:#33322E;--line-strong:#77736A;
  --ink:#ECEAE4;--ink-2:#B5B1A7;--ink-3:#8F8B81;--accent:#A9B8FF;--accent-bg:#232A4D;
  --warn:#E3B341;--warn-bg:#3A2E10;--bad:#FF9A8A;--bad-bg:#3F1D17;--on-accent:#141413;color-scheme:dark}
  :root:not([data-theme="light"]) .page{filter:brightness(.92)}}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1C1C1A;--surface-2:#232320;--line:#33322E;--line-strong:#77736A;
  --ink:#ECEAE4;--ink-2:#B5B1A7;--ink-3:#8F8B81;--accent:#A9B8FF;--accent-bg:#232A4D;
  --warn:#E3B341;--warn-bg:#3A2E10;--bad:#FF9A8A;--bad-bg:#3F1D17;--on-accent:#141413;color-scheme:dark}
:root[data-theme="dark"] .page{filter:brightness(.92)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* D5: the primary takes focus on arrival; its ring shows once a key is pressed (html.kbd) */
html:not(.kbd) .btn.pri:focus-visible{outline-color:transparent}
#app{position:relative;height:calc(100dvh - 64px);overflow:hidden}
#vroot,#end{position:absolute;inset:0}
[hidden]{display:none!important}
.id{font-feature-settings:"tnum","zero","ss02"}

/* ---------- shared atoms ---------- */
.kh{font:400 12px/16px var(--sans);border:1px solid var(--line-strong);border-radius:4px;padding:0 4px;color:var(--ink-2);display:inline-block;background:none;white-space:nowrap}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{height:44px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 15px/20px var(--sans);padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:background-color 120ms ease-out}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.pri .kh{color:inherit;border-color:currentColor;opacity:.85}
.btn.wide{width:100%;height:auto;min-height:44px;padding-block:6px}
.btn.wide>span:first-child{text-wrap:balance}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{height:32px;font-size:13px;padding:0 12px}
.lnk{background:none;border:0;padding:0;color:var(--accent);font:500 13px/20px var(--sans);cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:24px}
.lnk:hover{text-decoration:underline}
.g{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.g.s-located{color:var(--accent)}.g.s-check{color:var(--warn)}.g.s-unlocated,.g.s-missing{color:var(--ink-3)}.g.s-conflict{color:var(--bad)}.g.s-confirmed{color:var(--ink)}
.skel{display:inline-block;height:14px;width:120px;border-radius:3px;background:var(--line)}
.skel.hero-skel{height:44px;width:260px;border-radius:6px}
.none{color:var(--ink-3);font-weight:400}
.hero{font:500 56px/60px var(--serif);font-size:min(56px,calc(175cqi/var(--n,8)));font-variant-numeric:lining-nums tabular-nums;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.hero .cur{font-size:.6em;color:var(--ink-2);display:inline-block;vertical-align:top;margin:.1em .06em 0 0;line-height:1}
.hero .pa{font-size:.6em;color:var(--ink-2)}
button.hero{background:none;border:0;padding:0;cursor:text;text-align:left}
.amt{font:500 17px/24px var(--serif);font-variant-numeric:lining-nums tabular-nums}
input.ed{font:500 15px/22px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;width:100%;min-width:0;height:36px;font-variant-numeric:tabular-nums}
input.ed.big{font:500 44px/48px var(--serif);font-size:min(44px,calc(150cqi/var(--n,8)));height:64px;padding:4px 12px}
.st{font-size:12px;line-height:16px;color:var(--ink-2)}
.st.s-check{color:var(--warn)}.st.s-conflict{color:var(--bad)}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cand{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;cursor:pointer;min-height:44px}
.cand:hover{border-color:var(--box-warn)}
.cand .kh{grid-row:1/3}
.cand em{grid-column:2;font-style:normal;color:var(--ink-2);font-size:12px;min-width:0;overflow-wrap:anywhere}
.cand b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:13px;line-height:18px;color:var(--ink-2);margin-top:4px}
.ev,.st,.hint{text-wrap:pretty}

/* rows */
.row{position:relative;padding:8px 12px;border-radius:6px;min-height:40px;transition:background-color 120ms ease-out;cursor:default;outline-offset:-2px}
.row .r1{display:flex;align-items:center;gap:12px;min-height:24px}
.row .rl{font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;width:84px;flex:none}
.row .rv{flex:1;min-width:0;font:500 15px/22px var(--sans);overflow-wrap:anywhere}
.row .rv .val{cursor:text;font-feature-settings:"tnum","zero","ss02"}
@media (hover:hover){.row .rv .val:hover,.A-hero button.hero:hover{background:var(--surface-2);border-radius:6px;box-shadow:0 0 0 4px var(--surface-2)}}
.row .r2{padding-left:96px;margin-top:2px}
.row.title .rl{display:none}.row.title .r2{padding-left:0}
.row.title .rv{font:500 20px/26px var(--serif)}
.row.stop.s-check{background:var(--warn-bg)}
.row.stop.s-conflict{background:var(--bad-bg)}
.row.stop.s-unlocated,.row.stop.s-missing{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.row.f,.row.h{background:var(--accent-bg)}
.row.f .rl,.row.h .rl,.row.stop .rl{color:var(--ink-2)}
.stop .none,.f .none,.h .none{color:var(--ink-2)}
.row.f,.A-hero.f,.B-cell.f,.B-hero.f,.B-ven.f{outline:2px solid var(--accent);outline-offset:-2px}
.row.stop.s-check.f,.row.stop.s-check.h{background:var(--warn-bg)}
.row.stop.s-conflict.f,.row.stop.s-conflict.h{background:var(--bad-bg)}
@media (max-width:719px){.row{min-height:56px;padding:12px}.row .rl{width:84px}.row .r2{padding-left:96px}}

/* top bar + marks */
.bar{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--ink-2);overflow:hidden;white-space:nowrap}
.bar .cnt{color:var(--ink)}
.bar .ids{margin-left:auto}
.marks{display:flex;gap:0;min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.bar .ids,.bar .q{flex:none}
@media (max-width:379px){.bar .ids{display:none}}
.mk{width:26px;height:36px;border:0;background:none;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;border-radius:6px;padding:0}
.mk.cur{color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 -2px var(--accent)}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);background:none;cursor:pointer;color:var(--ink-2);font-size:13px;flex:none}
@media (max-width:719px){.bar{padding:0 12px;gap:8px}.bar .bk{display:none}.bar .ids{font-size:12px}}

.seg{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;padding:0 12px}
.seg button{border:1px solid var(--line-strong);background:none;border-radius:6px;padding:4px 10px;font-size:12px;line-height:16px;cursor:pointer;color:var(--ink-2);min-height:28px}
.seg button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.tally{font:500 17px/24px var(--serif);font-variant-numeric:lining-nums tabular-nums;color:var(--ink-2);margin-bottom:8px;padding:0 12px}
.tally small{display:block;font:400 12px/16px var(--sans);color:var(--ink-2)}
.ev{text-wrap:balance;display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:20px;color:var(--ink-2);margin-top:4px}
.ev .g{margin-top:2px}
.pay{margin-top:16px;padding:0 12px}
/* D3 Q1: status left, "Undo confirm" right; the primary below keeps its full width */
.stat{min-height:24px;font-size:12px;line-height:16px;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.stat .lnk{flex:none;white-space:nowrap}

/* ---------- paper ---------- */
.page{position:relative;container-type:inline-size;color:#1b1b1b;font-family:var(--sans);box-shadow:var(--shadow);outline:1px solid var(--line);flex:none}
.page .it{position:absolute;white-space:nowrap;line-height:1.2}
.page .it.bw{display:flex;align-items:center;overflow:visible}
.page .rule{position:absolute;height:max(1px,.14cqw);background:#2a2a2a}
.page .paper{position:absolute;background-image:linear-gradient(135deg,rgba(255,255,255,.3),rgba(0,0,0,.08));box-shadow:0 0 .8cqw rgba(0,0,0,.35)}
.page .ov{position:absolute;inset:0;pointer-events:none}
.page .ov svg.scrim{position:absolute;inset:0;width:100%;height:100%;transition:opacity 160ms ease-out}
.page .ov svg.scrim path{fill:rgba(20,20,19,.35)}
.bx{position:absolute;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.75);pointer-events:auto;cursor:pointer;transition:background-color 180ms ease-out,opacity 120ms ease-out,border-color 120ms}
.bx.total{border:calc(2px*var(--zi,1)) solid var(--box-accent);background:rgb(43 58 140/.12);mix-blend-mode:multiply}
.bx.other{border:calc(1px*var(--zi,1)) solid var(--box-accent);opacity:.55}
.bx.cd{border:calc(1.5px*var(--zi,1)) dashed var(--box-warn)}
.bx.conf,.bx.you{border:calc(1px*var(--zi,1)) solid rgb(28 27 25/.45);background:transparent}
.bx.bad{border-color:var(--box-bad)}
.bx.f{border-width:calc(2px*var(--zi,1));opacity:1;background:rgb(43 58 140/.16)}
.bx.f.cd{background:transparent}
.bx.dim{opacity:.25}
.bx.dim .tag,.bx .tag:empty{visibility:hidden}
.bx .tag{position:absolute;left:calc(-1px*var(--zi,1));bottom:calc(100% + 2px*var(--zi,1));font:600 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--box-accent);padding:3px 5px;border-radius:2px;white-space:nowrap;transform:scale(var(--zi,1));transform-origin:0 100%;pointer-events:none;display:flex;gap:3px;align-items:center}
.bx.cd .tag{background:var(--box-warn-ink)}
.bx.conf .tag,.bx.you .tag{background:rgb(28 27 25/.75)}
.bx.bad .tag{background:var(--box-bad)}
.bx.other:not(.f) .tag{display:none}
.bx.cd .tag,.bx.conf .tag,.bx.you .tag{left:calc(100% + 4px*var(--zi,1));bottom:auto;top:50%;transform:translateY(-50%) scale(var(--zi,1));transform-origin:0 50%}
.bx:focus-visible{outline:2px solid var(--box-accent);outline-offset:2px}

/* viewer */
.vw{position:relative;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none}
.vw .cam{position:absolute;left:0;top:0;transform-origin:0 0}
.B-page.vw:not(.locating){touch-action:pan-y pinch-zoom}
.vw.locating{cursor:crosshair}
.vw:focus-visible{outline-offset:-2px}
.vw.locating .page .it[data-ocr]:focus-visible{outline:2px solid var(--box-accent);outline-offset:2px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.vw-corner{position:absolute;width:calc(10px*var(--zi,1));height:calc(10px*var(--zi,1));margin:calc(-5px*var(--zi,1)) 0 0 calc(-5px*var(--zi,1));border:calc(1.5px*var(--zi,1)) solid var(--box-ink);border-radius:50%;background:rgb(28 27 25/.15);pointer-events:none}
.vw.locating .bx{pointer-events:none}
.vw.locating .page .it[data-ocr]:hover{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:rgba(43,58,140,.6);text-underline-offset:.3cqw}
.vw-chip{position:absolute;left:0;right:0;top:auto;bottom:0;background:var(--surface);border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 12px;text-align:center;font-size:12px;line-height:16px;color:var(--ink-2);max-width:none;z-index:3}
.vw-cap{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;z-index:4;text-align:center}
.vw-ph{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;color:var(--ink-2);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px);z-index:2;padding:16px}
.vw-draft{position:absolute;border:1.5px solid var(--box-ink);background:rgb(28 27 25/.08);pointer-events:none}
@keyframes rise{from{opacity:.4;translate:0 calc(8px*var(--zi,1))}to{opacity:1;translate:0 0}}
.vw .cam.enter .page{animation:rise 160ms ease-out}
@keyframes slidein{from{opacity:0;translate:48px 0}to{opacity:1;translate:0 0}}
.vw.slide .cam.enter .page{animation:slidein 240ms var(--ease)}
.pages{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;z-index:3}
.pages button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:12px;padding:2px 10px;cursor:pointer;color:var(--ink)}
.pages button.dim{opacity:1;color:var(--ink-2);border-color:var(--line)}
.pages .pg1{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:12px;padding:2px 10px;color:var(--ink)}

/* crops */
.crop{position:relative;overflow:hidden;background:var(--surface-2);border-radius:3px;outline:1px solid var(--line);width:100%}
.crop .cin{position:absolute;left:0;top:0;transform-origin:0 0}
.crop .cin .page{box-shadow:none;outline:0}
.crop .bx:not(.total) .tag{display:none}
.crop.hatch{width:100%;font-family:inherit;display:flex;align-items:center;gap:12px;padding:6px 12px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px),var(--surface-2);border:1px dashed var(--line-strong);cursor:pointer;color:var(--ink-2);font-size:13px;line-height:18px;text-align:left}
.crop.hatch .thumb{flex:none;overflow:hidden;border-radius:2px;background:#fff}
.crop.hatch .thumb .page{box-shadow:none;outline:1px solid var(--line)}
.crop.hatch b{font-weight:500;color:var(--ink)}
.crop.hatch u{color:var(--accent)}
.crop.hatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* R3-1: one ring; the tint stays on the field the button acts on */
html.kbd #vroot:has(.btn.pri:focus-visible) .ft.f,#vroot:has(.crop.hatch:focus-visible) .ft.f{outline-color:transparent}
/* B5: while pointing, keys go to the page, so the ring is there */
#vroot:has(.vw.locating:focus-within) .ft.f{outline-color:transparent}
/* B9: a ringed group holds its crop without a second frame */
.ft.f .crop:not(.hatch){outline:0}

/* ---------- A ---------- */
.A,.B,.C,.D{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.A-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,38%,440px)}
.A-pane{min-height:0}
.A-rail{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.A-scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:24px 24px 16px;scroll-padding-block:16px}
.A-foot{padding:12px 24px 16px;border-top:1px solid var(--line)}
.A-foot .stat{padding:0 12px}
.A-hero{padding:12px;border-radius:6px;margin:24px 0 16px;position:relative;transition:background-color 120ms;container-type:inline-size}
.A-hero.f,.A-hero.h{background:var(--accent-bg)}
.A-hero.stop.s-conflict{background:var(--bad-bg)}
.A-hero.stop.s-check{background:var(--warn-bg)}
.A-hero .strip{margin-bottom:12px}
.A-hero .detail{margin-top:8px}
.A-lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:none;z-index:5}
.A-lead.on{opacity:1;transition:opacity 120ms ease-out}
.A-lead path{fill:none;stroke:var(--accent);stroke-width:1px}
.A-lead path.case{stroke:var(--bg);stroke-width:3px}
.A-lead.dot path{opacity:.4}
.A-lead circle{fill:var(--accent);stroke:var(--bg);stroke-width:1px}
@media (max-width:719px){
  .A-main{grid-template-columns:1fr;grid-template-rows:42% minmax(0,1fr)}
  .A-rail{border-left:0;border-top:1px solid var(--line)}
  .A-scroll{padding:16px}.A-foot{padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
  .btn.pri{height:56px}.btn.pri.wide{height:auto;min-height:56px}.hero{font-size:min(44px,calc(175cqi/var(--n,8)));line-height:48px}.A-lead{display:none}
  .A-hero{margin:16px 0 8px}
}

/* ---------- B ---------- */
.B-scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:24px 16px 48px;scroll-behavior:smooth;scroll-padding:16px 0 24px}
.B-col{max-width:680px;margin:0 auto}
.B-col.enter{animation:colup 200ms ease-out}
@keyframes colup{from{opacity:.5;transform:translateY(16px)}to{opacity:1;transform:none}}
.B-page{max-width:680px;margin:0 auto 16px;height:min(46vh,440px);border-radius:10px;border:1px solid var(--line)}
.B-vendor{font:500 20px/26px var(--serif);margin:0;text-align:left}
.B-ven{padding:8px 12px;border-radius:6px;text-align:left;margin-bottom:12px}
.B-ven .vv{display:inline-flex;gap:10px;align-items:center;justify-content:flex-start}
.B-hero{padding:12px;border-radius:6px;transition:background-color 120ms;container-type:inline-size}
/* D1: the read total and its evidence end where the printed box ends, 12px inside the strip */
.B-read{text-align:right;margin-top:6px;padding-right:12px}
.B-ev{justify-content:flex-end;padding-right:12px}
.A-hero .B-read{margin-top:0}
.B-read.L,.A-hero:has(.strip .crop.hatch) .B-read{text-align:left}
.B-read.L~.B-ev,.A-hero:has(.strip .crop.hatch) .B-ev{justify-content:flex-start}
.B-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:24px}
.B-cell{padding:8px;border-radius:6px;min-width:0;transition:background-color 120ms}
.f.B-cell,.f.B-hero,.f.B-ven,.h.B-cell,.h.B-hero{background:var(--accent-bg)}
.B-cell.stop.s-check,.B-hero.stop.s-check{background:var(--warn-bg)}
.B-cell.stop.s-conflict,.B-hero.stop.s-conflict{background:var(--bad-bg)}
.B-cell.stop.s-unlocated,.B-cell.stop.s-missing,.B-hero.stop.s-unlocated,.B-hero.stop.s-missing{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.B-cell.wide{grid-column:1/-1}
.B-cell .crop{margin-bottom:6px}
/* B8, R5-15: fade (14px) the half-cut lines at a phone crop's top and bottom; the crop's own background shows, as a mask on .cin would */

    const ven=`<div class="B-ven ft s-${vds}${isStop(b,'vendor')?' stop':''}${S.focus==='vendor'?' f':''}" data-key="vendor" data-hover="vendor" tabindex="0" role="group" aria-label="${esc(groupLabel(b,'vendor'))}"><span class="vv B-val"><span class="B-vendor">${valHTML(b,'vendor')}</span>${edIn(b,'vendor')}${glyph(vds)}</span>${r2On(b,'vendor')?`<div class="r2" style="padding:0">${detailR(b,'vendor')}</div>`:''}</div>`;

/* =====================================================================

function makeC(){
  let root,rib,card,vw;

    else if(ds==='unlocated'||(ds==='conflict'&&!f.box)){const rv=f.reader||valueText(b,k);sub=`The reader says <b>${esc(valueText(b,k)||'nothing')}</b> but it wasn’t found on the page. Click it on the bill, or check by eye.${ds==='conflict'?`<div class="st s-conflict" style="margin-top:4px">${esc(payRel(b).t)}</div>`:''}`}
    else if(f.state==='missing')sub=required(b,k)?'The reader found nothing. Type it, or point to it on the bill.':'Nothing was read. Most bills have none.';
    else sub=esc(k==='total'?[payRel(b).t.replace(/^equals/,'equals'),`${otherCount(b,k)} other values found`,st.length&&!stop?`${st.length} to check`:''].filter(Boolean).join(' · '):stateText(b,k));

    const edit=f.candidates||f.pending||b.confirmed?'':`<button class="btn" data-act="edit" data-key="${k}">Edit <span class="kh">E</span></button>`;
    const loc=!S.locating&&!f.candidates&&!f.pending&&!b.confirmed&&(ds==='unlocated'||ds==='missing'||(ds==='conflict'&&!f.box))?`<button class="lnk" data-act="locate" data-key="${k}">Point to it <span class="kh">L</span></button>`:'';

    </div>`}
  function render(reason){const b=cur();

    head.innerHTML=`<h1>Bills to review · ${S.bills.filter(x=>!x.confirmed).length}</h1><span class="sum">${clean} clean · ${chk} to check</span><button class="btn pri" data-act="dbulk"${tg?'':' disabled'}><span>Confirm ${tg} clean</span><span class="kh">⌘↵</span></button>`;
    body.innerHTML=`<div class="D-th" role="row"><span></span><span></span><span>Vendor</span><span>Date</span><span>As printed</span><span class="r">Total</span><span>Payment</span><span></span></div>`+S.bills.map(rowHTML_D).join('')+(S.bills.every(x=>x.confirmed)?'<div class="D-empty">All bills reviewed.</div>':'');
    const row=$(`.D-row[data-i="${S.idx}"]`,body);
    if(open&&!b.confirmed&&row){row.after(panel);panel.hidden=false;fillPanel(b)}else{panel.hidden=true;panel.remove()}

    onKey(e){
      if(dlg){if(e.key==='Enter'){dlgOk();return true}if(e.key==='Escape'){dlg=null;render();return true}return true}
      if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){const t=bulkTargets(sel);if(!t.length){S.status='No clean bills to confirm';emit('change');return true}dlg=t;dlgEl();return true}
      if((e.metaKey||e.ctrlKey)||e.altKey)return false;
      if(open){if(e.key==='Escape'&&!S.locating&&S.zoomMode==='page'){open=false;emit('change');return true}return false}
      const k=e.key;
      if(k==='ArrowDown'||k==='ArrowUp'||k==='j'||k==='k'){S.done=false;openBill(S.idx+(k==='ArrowDown'||k==='j'?1:-1));return true}
      if(k==='Enter'){const b=cur();if(b.confirmed)return true;if(isClean(b)){confirmBill(b);return true}openPanel();return true}
      if(k==='x'||k==='X'){sel.has(S.idx)?sel.delete(S.idx):sel.add(S.idx);render();return true}
      return false},
    onAct(act,el){
      if(act==='dsel'){const i=+el.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);render();return true}
      if(act==='dopen'){S.openBill(+el.dataset.i);return true}
      if(act==='dclose'){open=false;emit('change');return true}
      if(act==='dbulk'){const t=bulkTargets(sel);if(t.length){dlg=t;dlgEl()}return true}
      if(act==='dcancel'){dlg=null;render();return true}
      if(act==='dok'){dlgOk();return true}
      return false},
    onRow(i){if(i!==S.idx)openBill(i);if(isPhone()||false)openPanel()},
    destroy(){vw.destroy()}};
  function openPanel(){const b=cur();if(b.confirmed)return;open=true;S.zoomMode='field';emit('change')}
  function dlgOk(){const t=dlg;dlg=null;sel.clear();bulkConfirm(t)}
  S.openBill=i=>{if(i!==S.idx)openBill(i);openPanel()};
  return V}

/* =====================================================================
   VARIANT R: recommended blend = A structure + B's crop over the total + C's stop-to-stop Enter flow
   (laptop: A with the proof strip; phone: B's column; the Enter flow is the store's default)
   ===================================================================== */
function makeR(){
  let root,sub,mq=matchMedia('(max-width:719px)'),h=()=>build();
  function build(){if(sub)sub.destroy();root.innerHTML='';sub=mq.matches?makeB():makeA({strip:true});S.nav=sub.nav;sub.mount(root);sub.update('bill')}
  return{get nav(){return sub?.nav},
    mount(r){root=r;mq.addEventListener('change',h);build()},
    update(reason){sub.update(reason)},onKey(e){return sub.onKey?.(e)},onAct(a,el,e){return sub.onAct?.(a,el,e)},
    destroy(){mq.removeEventListener('change',h);sub.destroy()}}}
/* =====================================================================
   SHARED: prototype chrome (switcher, theme, state readout, help, toast) and global input
   ===================================================================== */
const VARIANTS={A:{name:'Margin Notes',make:makeA},B:{name:'Proof Strips',make:makeB},C:{name:'Spotlight',make:makeC},D:{name:'Tally Sheet',make:makeD},R:{name:'Recommended blend',make:makeR}};
const ORDER=Object.keys(VARIANTS);
let V=null,vkey=null;
function setVariant(k,silent){if(!VARIANTS[k])k='A';
  if(V)V.destroy();$('#vroot').innerHTML='';S.startKey=null;S.primaryFn=null;S.openBill=null;S.viewOpen=false;S.sim=null;S.editing=null;S.locating=null;
  vkey=k;V=VARIANTS[k].make();V.mount($('#vroot'));S.nav=V.nav||KEYS;
  $('#plab').textContent=`${k} · ${VARIANTS[k].name}`;
  const u=new URL(location.href);u.searchParams.set('variant',k);history.replaceState(null,'',u);
  document.title=`Bill review · ${k}`;
  S.openBill=S.openBill||null;
  openBill(S.idx)}
const cycle=d=>setVariant(ORDER[(ORDER.indexOf(vkey)+d+ORDER.length)%ORDER.length]);

function render(reason){
  const end=$('#end'),vr=$('#vroot');
  if(S.done){const first=end.hidden,ae=document.activeElement,had=first||end.contains(ae)||ae===document.body;vr.hidden=true;end.hidden=false;
    if(first||reason!=='hover'){end.innerHTML=endHTML();if(had)$('h1',end).focus()} /* R3-9 */
    if(first)$('#live').textContent=[...end.querySelectorAll('h1,p,.endd')].map(x=>x.textContent).join(' ')}else{end.hidden=true;vr.hidden=false;V.update(reason)}
  renderToast();renderLive();renderState(reason);renderHelp()}
on(render);
/* chrome renderers */
let toastT=0,toastShown=null;
function renderToast(){const el=$('#toast'),t=S.done?null:S.toast; /* the end screen has its own Undo */
  document.body.classList.toggle('toast-on',!!t);
  if(!t){el.hidden=true;toastShown=null;el.style.bottom='';return}
  if(toastShown!==t.t){toastShown=t.t;el.hidden=false;el.innerHTML=`<span>${esc(t.text)}</span><button data-act="${t.ref?'toastundo':'undo'}">Undo</button>`; /* R5-16: no ⌘Z hint; the toast undoes its own bill, ⌘Z the latest change */
    /* R3-5: waits while hovered or focused */
    const hide=()=>{if(el.matches(':hover')||el.contains(document.activeElement)){toastT=setTimeout(hide,2000);return}S.toast=null;el.hidden=true;el.style.bottom='';document.body.classList.remove('toast-on')};
    clearTimeout(toastT);toastT=setTimeout(hide,6000)}
  /* phone: the toast sits in the room the pinned footer makes for it, measured so a taller footer still fits */
  const pin=isPhone()&&$('.B-pin:not([hidden])');el.style.bottom=pin?(innerHeight-pin.getBoundingClientRect().top-el.offsetHeight-5)+'px':''}
function renderHelp(){const el=$('#help');if(!S.help){if(el.open){el.close();const f=()=>{if(document.activeElement?.closest?.('#help'))document.activeElement.blur();syncDomFocus($('#vroot'))};f();setTimeout(f,0)}return}
  if(el.open)return;
  const rows=[['Enter','Do the next obvious thing'],['⌘/Ctrl Enter','Confirm bill from anywhere, if clean'],['↑ ↓  Tab','Move between fields'],['1 2 3','Take a candidate'],['E  F2','Edit the focused value'],['L','Point to it on the page'],['N','Not on the bill'],['Z','Fit page / fit field'],['J  K','Next / previous bill'],['S','Skip for later'],['⌘/Ctrl Z','Undo the last change'],['Space','Whole bill (B)'],['X','Select a row (D)'],['← →','Prototype: switch variant'],['?','This list'],['Esc','Cancel edit, leave locate, zoom out']];
  el.innerHTML=`<div class="hh"><h2>Keys</h2><button class="btn sm" data-act="closehelp">Close <span class="kh" aria-hidden="true">Esc</span></button></div><dl>${rows.filter(r=>vkey!=='R'||!['Space','X','← →'].includes(r[0])).map(r=>`<dt><span class="kh">${esc(r[0])}</span></dt><dd>${esc(r[1])}</dd>`).join('')}</dl><label class="sk"><input type="checkbox" id="sk"${S.singleKeys===false?'':' checked'}> Single-key shortcuts</label>`;el.showModal()}
$('#help').addEventListener('close',()=>{if(S.help){S.help=false;emit('help')}});
/* R3-8: speak each new status (even repeated words), each new toast and each arrival; never re-speak on a plain re-render */
let liveSeen={};
function renderLive(){if(S.done)return;const n={s:S.statusN,t:S.toast?.t,a:S.arrive};
  const fresh=(S.status&&n.s!==liveSeen.s)||(n.t&&n.t!==liveSeen.t)||(n.a&&n.a!==liveSeen.a);liveSeen=n;if(!fresh)return;
  say([S.status||(S.toast&&S.toast.text),S.arrive].filter(Boolean).map(x=>x.replace(/\.$/,'')).join('. '));S.arrive=''} /* B4: an arrival is spoken once */
function say(m){const el=$('#live');el.textContent=m+(el.textContent===m?'\u00A0':'')}
function renderState(reason){const box=$('#statebox');if(box.hidden||reason==='hover')return;const b=cur();if(!b)return;
  const rows=KEYS.map(k=>{const f=b.fields[k],d=disp(b,k);return `<div><span class="k">${NAMES[k].padEnd(11)}</span> ${d}${isStop(b,k)?' · STOP':''}${f.box?' · box':''}${f.differs?' · differs':''}${f.placed?' · placed':''}<br>&nbsp;&nbsp;<span class="k">${esc(String(valueText(b,k)??'none')).slice(0,34)}</span></div>`}).join('');
  box.innerHTML=`<b>${b.ref}</b> ${S.idx+1}/${S.bills.length} · ${b.kind}${b.confirmed?' · CONFIRMED':''}${S.done?' · ALL DONE':''}<br>
  <span class="k">stops</span> ${stops(b).join(', ')||'none (clean)'}<br><span class="k">focus</span> ${S.focus} <span class="k">edit</span> ${S.editing||'-'} <span class="k">locate</span> ${S.locating||'-'}<br>
  <span class="k">zoom</span> ${S.zoomMode} <span class="k">undo</span> ${S.undo.length} <span class="k">variant</span> ${vkey}<br><br>${rows}<br>
  <span class="k">bills</span> ${S.bills.map(x=>x.ref.slice(2)+(x.confirmed?'✓':worst(x)==='located'?'○':'◇')).join(' ')}<br><br>
  simulate <select id="sim" aria-label="Simulate"><option value="">normal</option><option value="reading"${S.sim==='reading'?' selected':''}>still reading</option><option value="failed"${S.sim==='failed'?' selected':''}>couldn’t read</option><option value="noPreview"${S.sim==='noPreview'?' selected':''}>preview failed</option></select>
  <button id="rst" style="margin-left:6px">reset all</button>`}
function resetAll(){S.bills=JSON.parse(JSON.stringify(BILLS));S.undo=[];S.done=false;S.toast=null;openBill(0)}
document.addEventListener('change',e=>{if(e.target.id==='sk'){S.singleKeys=e.target.checked;return}if(e.target.id==='sim'){S.sim=e.target.value||null;if(!S.sim)S.editing=null;if(S.sim==='failed'){S.editing='total';S.focus='total'}
  if(S.sim==='reading'&&S.focus!=='total'){S.focus='total'}emit('sim')}});

/* global clicks */
document.addEventListener('click',e=>{const t=e.target;
  if(t.id==='rst'){resetAll();return}
  const a=t.closest('[data-act]');
  const dr=t.closest('.D-row');
  if(a){const act=a.dataset.act,key=a.dataset.key||a.closest('[data-key]')?.dataset.key||S.focus;
    if(V.onAct&&V.onAct(act,a,e))return;
    switch(act){
      case'edit':startEdit(key);break;
      case'locate':startLocate(key);break;
      case'notbill':S.focus=key;notOnBill(key);break;
      case'pick':pick(key,+a.dataset.n);break;
      case'confirm':(S.primaryFn||doPrimary)();break;
      case'openbill':S.done=false;openBill(+a.dataset.i);break;
      case'help':S.help=true;emit('help');break;
      case'closehelp':S.help=false;emit('help');break;
      case'undo':doUndo();break;
      case'undoconfirm':undoConfirm();break;
      case'toastundo':undoConfirm(S.bills.findIndex(x=>x.ref===S.toast?.ref));break;
      case'reset':resetAll();break}
    return}
  if(dr&&V.onRow){V.onRow(+dr.dataset.i);return}
  const ft=t.closest('.ft[data-key]');if(ft&&ft.dataset.key!==S.focus)setFocus(ft.dataset.key);
  if(S.help&&t.id==='help'){const r=t.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){S.help=false;emit('help')}}});
/* R3-1: a pointer press must not rebuild the control under it; the click handler moves the field focus, and the primary acts on the field it names */
/* D5: html.kbd from the first real key until the next pointer press */
const capSync=()=>$('.vw.locating')?._v?.caption(false); /* R5-7: the caption's key hint follows html.kbd */
let viaPtr=false;addEventListener('pointerdown',()=>{viaPtr=true;if(document.documentElement.classList.contains('kbd')){document.documentElement.classList.remove('kbd');capSync()}},true);
addEventListener('keydown',e=>{viaPtr=false;if(!['Shift','Control','Alt','Meta'].includes(e.key)&&!document.documentElement.classList.contains('kbd')){document.documentElement.classList.add('kbd');capSync()}},true);
document.addEventListener('focusin',e=>{if(viaPtr)return;const ft=e.target.closest?.('.ft[data-key]');
  if(ft?.dataset.key==='confirm'){if(!S.done&&S.focus!=='confirm'&&!stops(cur()).length)setFocus('confirm');return} /* B7: on a clean bill the primary acts on the whole bill */
  if(ft&&ft.dataset.key!==S.focus&&!e.target.closest('.proto'))setFocus(ft.dataset.key)});
document.addEventListener('mouseover',e=>{const h=e.target.closest?.('[data-hover]');const k=h?h.dataset.hover:null;if(k!==S.hover)setHover(k)});

/* global keys: the spec's laptop map (2.8) */
addEventListener('keydown',e=>{
  const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(S.help){if(e.key==='Escape'||e.key==='?'){S.help=false;emit('help')}return}
  if(V&&V.onKey&&V.onKey(e)){e.preventDefault();return}
  const k=e.key;
  if(S.locating&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(k)){e.preventDefault();walkWord(k);return}
  if((k==='ArrowLeft'||k==='ArrowRight')&&vkey!=='R'){e.preventDefault();cycle(k==='ArrowRight'?1:-1);return}
  if(e.metaKey||e.ctrlKey){if(k==='Enter'){e.preventDefault();confirmBill(cur())}else if(k.toLowerCase()==='z'){e.preventDefault();doUndo()}return}
  if(e.altKey)return;
  if(k==='Enter'){if(t.closest&&t.closest('button,a,[role="button"]')&&!t.closest('[data-act="confirm"]'))return;if(t.closest&&t.closest('[data-act="confirm"]'))return;e.preventDefault();(S.primaryFn||doPrimary)();return}
  if(S.done)return;
  const field=S.focus&&S.focus!=='confirm'?S.focus:null;
  if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const o=[...(S.nav||KEYS),'confirm'];let i=o.indexOf(S.focus);if(i<0)i=k==='ArrowDown'?-1:o.length;setFocus(o[clamp(i+(k==='ArrowDown'?1:-1),0,o.length-1)]);return}
  if(S.singleKeys===false&&k.length===1)return; /* R3-16 */
  if(k==='1'||k==='2'||k==='3'){if(field)pick(field,+k);return}
  if(k==='e'||k==='E'||k==='F2'){e.preventDefault();startEdit(field||'total');return}
  if(k==='l'||k==='L'){startLocate(field||'total');return}
  if(k==='n'||k==='N'){if(field)notOnBill(field);return}
  if(k==='z'||k==='Z'){S.zoomMode=S.zoomMode==='field'?'page':'field';emit('zoom');return}
  if(k==='Escape'){if(S.locating)endLocate();else{S.zoomMode='page';emit('zoom')}return}
  if(k==='j'||k==='J'){go(1);return}
  if(k==='k'||k==='K'){go(-1);return}
  if(k==='s'||k==='S'){skip();return}
  if(k==='?'){S.help=true;emit('help')}});

/* D4: while pointing, ←/→ walk the printed words in reading order, ↑/↓ go a line, Home/End to the ends */
/* R5-10: one reading order (lines top to bottom, words left to right) for Tab and the arrows */
function readingLines(b,ws){const R=w=>itemR(b,w.dataset.id),cy=w=>R(w)[1]+R(w)[3]/2,lines=[];
  for(const w of [...ws].sort((a,c)=>cy(a)-cy(c))){const l=lines.at(-1);if(l&&cy(w)-cy(l[0])<R(l[0])[3]/2)l.push(w);else lines.push([w])}
  lines.forEach(l=>l.sort((a,c)=>R(a)[0]-R(c)[0]));return lines}
function walkWord(k){const host=$('.vw.locating');if(!host)return;const b=cur(),ws=$$('.it[data-ocr]',host);if(!ws.length)return;
  const R=w=>itemR(b,w.dataset.id),cx=w=>R(w)[0]+R(w)[2]/2,lines=readingLines(b,ws);const flat=lines.flat(),w0=document.activeElement?.closest?.('.it[data-ocr]'),i=flat.indexOf(w0);let t;
  if(k==='Home')t=flat[0];else if(k==='End')t=flat.at(-1);else if(i<0)t=flat[0];
  else if(k==='ArrowLeft'||k==='ArrowRight')t=flat[clamp(i+(k==='ArrowRight'?1:-1),0,flat.length-1)];
  else{const li=lines.findIndex(l=>l.includes(w0));t=lines[clamp(li+(k==='ArrowDown'?1:-1),0,lines.length-1)].reduce((a,c)=>Math.abs(cx(c)-cx(w0))<Math.abs(cx(a)-cx(w0))?c:a)}
  t.focus({preventScroll:true})}

/* switcher, theme, state toggle */
$('#pv').onclick=()=>cycle(-1);$('#pn').onclick=()=>cycle(1);
$('#pt').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
$('#ps').onclick=()=>{const b=$('#statebox');b.hidden=!b.hidden;$('#ps').classList.toggle('on',!b.hidden);renderState('change')};

/* boot */
(async()=>{
  await calibrate();selfCheck();
  S.bills=JSON.parse(JSON.stringify(BILLS));
  const qp=new URLSearchParams(location.search),bi=S.bills.findIndex(b=>b.ref===qp.get('bill'));if(bi>0)S.idx=bi;
  setVariant(qp.get('variant')?.toUpperCase()||'A');
  window.__dues={S,setVariant,cur};
})();
</script>
