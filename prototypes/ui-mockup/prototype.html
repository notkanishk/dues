 .tray{display:none}

 .cwrap{display:block}

<script>
/* ===== helpers ===== */
const TODAY='2026-11-20',MON='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
const $=s=>document.querySelector(s);
const D=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const days=(a,b=TODAY)=>Math.round((D(b)-D(a))/864e5);
const fd=d=>{const[y,m,x]=d.split('-');return +x+' '+MON[m-1]+(y!=='2026'?' '+y:'')};

const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const inr0=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>Math.round(a.reduce((s,x)=>s+x,0)*100)/100;
const bdg=(t,c,x='')=>`<span class="bdg k-${c} ${x}">${esc(t)}</span>`;

const S={seq:100,last:'Savings',
items:[
mk(1,'2026-11-18','Solder wire 60/40 500 g ×2','Robu.in','online',['RB-482917',''],'Card',1180,'await','2026-11-18',[]),

mk(4,'2026-11-11','Plywood 18 mm ×2 + flexible ply','New Era Plywood','shop',['',''],'Savings',6450,'inv','2026-11-11',[['UPI screenshot','proof']],{purpose:'Workbench build'}),
mk(5,'2026-11-14','Cab to hardware market (return)','City Cabs','service',['',''],'Savings',1800,'inv','2026-11-14',[]),
mk(6,'2026-11-19','Spray paint matte black ×6','Blinkit','online',['BLK-90417733',''],'Card',1314,'inv','2026-11-19',[],{hist:{delivered:'2026-11-19'}}),
mk(7,'2026-11-17','Expo flyers A5 ×500','QuickPrint Copy Centre','service',['','2291'],'Savings',2360,'ready','2026-11-17',[['Expo Flyers Invoice.pdf','invoice']],{purpose:'Expo'}),
mk(8,'2026-11-03','AWS invoice — October','Amazon Web Services','service',['','2026-OCT-1193'],'Card',1042.37,'ready','2026-11-03',[['AWS Invoice.pdf','invoice']]),

 return `<div class="card ${un?'ca':''}" data-a=bx data-n="${esc(b.name)}"><div class=ct><span class=cw>${esc(b.name)}</span><b>${inr(bTotal(b))}</b></div><div class="cm mu">${bCount(b)} items · ${b.sub?'submitted '+fd(b.sub):b.status==='draft'?'draft':'paid'} ${b.status==='reimbursed'?'':'· '+age+' d'}</div><div class=cbd>${bdg({draft:'Draft',submitted:'Submitted',reimbursed:'Reimbursed'}[b.status],{draft:'g',submitted:'b',reimbursed:'n'}[b.status])}${un?bdg('⚑ unpaid · '+age+' d','a'):''}</div>${U.bexp[b.name]?brows(b).map(r=>`<div class=ln><span>${esc(r.desc)}</span><span>${inr(r.amt)}</span></div>`).join(''):''}<div class=cf>${batchActs(b)}</div></div>`}

 else{const L=S.items.filter(i=>i.stage===k).sort((a,b)=>Math.max(0,...attF(b).map(f=>f.age+1))-Math.max(0,...attF(a).map(f=>f.age+1)));n=L.length;tot=sum(L.map(i=>i.amount));red=L.filter(i=>flagsOf(i).some(f=>f.c==='r')).length;body=L.map(cardI).join('');
