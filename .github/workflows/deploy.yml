name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'notkanishk/dues'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/notkanishk/dues:${{ github.sha }}

  # Self-hosted jobs: no checkout, no actions, no token. The host's only CI power is dues-deploy.
  dev:
    needs: image
    runs-on: [self-hosted, dues-dev]
    environment: dev
    timeout-minutes: 15
    steps:
      - run: sudo -n /usr/local/sbin/dues-deploy "ghcr.io/notkanishk/dues@${DIGEST}"
        env:
          DIGEST: ${{ needs.image.outputs.digest }}

  prod:
    needs: [image, dev]
    runs-on: [self-hosted, dues-prod]
    environment: prod
    timeout-minutes: 15
    steps:
      - run: sudo -n /usr/local/sbin/dues-deploy "ghcr.io/notkanishk/dues@${DIGEST}"
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
