name: ci

on:
  push:
  pull_request:
  workflow_call: # deploy.yml runs these tests before any host deploys

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dues_test
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dues_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/dues_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # ADR 0007: clear tsconfig.tsbuildinfo and run `next build` before tsc (the build script does both;
      # it also writes next-env.d.ts, which tsc needs).
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      # The hosts build this Dockerfile on deploy; a broken one fails here first. Nothing is pushed.
      - run: docker build .
