# Dues stack. Lives on the host as /opt/dues/compose.yaml; run only by /usr/local/sbin/dues-deploy:
#   docker compose --env-file .image.env pull && up -d --remove-orphans --wait
# .image.env holds DUES_IMAGE=ghcr.io/<owner>/dues@sha256:<digest>; secrets come from /opt/dues/.env.
# Every service has a healthcheck so `--wait` means "healthy", not just "started".
name: dues

services:
  postgres:
    image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
    restart: unless-stopped
    env_file: .env # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    environment:
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:9.9.1@sha256:0fc05327fcc4af8ba84bb99b3da35fe728840d98cef9d3bf0d701bd077834eb5
    restart: unless-stopped
    environment:
      TZ: UTC
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: ${DUES_IMAGE:?DUES_IMAGE is set by dues-deploy in .image.env}
    restart: unless-stopped
    env_file: .env # DATABASE_URL
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "3000:3000" # the only published port; the host firewall limits who may reach it
    networks: [internal, edge]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s # migrations run before the server starts

  worker:
    # ponytail: depends_on is not applied on a host reboot (restart: unless-stopped); fine until the worker reads app tables.
    image: ${DUES_IMAGE:?DUES_IMAGE is set by dues-deploy in .image.env}
    command: ["worker.js"]
    restart: unless-stopped
    env_file: .env # DATABASE_URL
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    networks: [internal, edge]
    depends_on:
      web: { condition: service_healthy } # web has applied the migrations
    healthcheck:
      test: ["CMD", "/usr/local/bin/bun", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/worker-alive').mtimeMs < 60000 ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

networks:
  internal:
    internal: true # Postgres and Gotenberg: no published ports, no outbound
  edge: {}

volumes:
  pgdata: {}
